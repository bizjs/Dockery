name: Build and Push to GHCR

# Two ways to ship a release:
#
# 1. Tag-driven (standard):
#      git tag -a v0.1.0 -m 'Release 0.1.0' && git push origin v0.1.0
#    → image :0.1.0 + :latest, footer v0.1.0.
#
# 2. Manual (Actions → Run workflow → enter tag):
#    Type the bare version (e.g. 0.1.0). It's used verbatim as the
#    image tag and APP_VERSION; the git tag pushed to origin is
#    v-prefixed (→ v0.1.0) to stay consistent with path 1.
#
# Structure: a `build` job (image build/push/attest) and a separate
# `release` job (GitHub Release + CHANGELOG splice). The split means a
# flaky release step never costs a rebuild — just re-run the `release`
# job to recover a missed CHANGELOG (the historical 0.8.0 gap). The
# release steps are also idempotent, so re-running is safe.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Bare version, e.g. 0.1.0 (no v prefix). Used as-is for the image tag and APP_VERSION; the git tag pushed to origin is v-prefixed (→ v0.1.0).'
        required: true
        type: string

# Serialize releases: two tags pushed close together would otherwise
# race the CHANGELOG commit on main (non-fast-forward push → lost
# changelog). cancel-in-progress:false queues rather than drops.
concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # write: create + push the git tag on manual dispatch.
      contents: write
      packages: write
      # attest-build-provenance needs an OIDC token + attestation write.
      id-token: write
      attestations: write
    outputs:
      # Resolved v-prefixed tag, consumed by the release job. On tag
      # push this is the ref; on manual dispatch github.ref_name is the
      # *branch*, so we derive it from the input instead.
      release_tag: ${{ steps.resolve.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # metadata-action's latest=auto needs all tags visible to
          # decide whether the current ref is the highest semver.
          fetch-depth: 0

      - name: Resolve release tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Dockery image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest=auto: :latest only when pushing the highest semver
          # tag. Manual dispatch (raw value) won't touch :latest.
          flavor: |
            latest=auto
          # Tag push: semver pattern strips the 'v' → :0.1.0.
          # Manual:   use the input verbatim → :<whatever-you-typed>.
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      # Manual dispatch only — tag pushes already carry the git tag.
      # GITHUB_TOKEN-pushed tags don't re-trigger this workflow
      # (GitHub policy), but this run continues regardless. Runs BEFORE
      # the build so a duplicate tag fails fast without publishing an
      # orphan image.
      - name: Push git tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v$TAG" "$GITHUB_SHA" -m "Release v$TAG"
          git push origin "v$TAG"

      - name: Build and push Dockery image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # --- Changelog + GitHub Release (semi-automatic via git-cliff) ---
  #
  # Separate job: only runs if `build` fully succeeded, so we never
  # announce a broken image. Being its own job, it's independently
  # re-runnable — recover a missed CHANGELOG without a rebuild.
  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # write: create the Release + commit CHANGELOG back to main.
      contents: write
    env:
      TAG: ${{ needs.build.outputs.release_tag }}

    steps:
      - name: Checkout at the release tag
        uses: actions/checkout@v4
        with:
          # The tag (v-prefixed). On manual dispatch it was just pushed
          # by the build job. Full history + tags so git-cliff --latest
          # can resolve the newest section.
          ref: ${{ needs.build.outputs.release_tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Generate release notes for this tag
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          # --latest: just the section for the newest tag.
          # --strip header: drop the "# Changelog" preamble so the
          # output is exactly the `## [x.y.z]` block — good both as a
          # GitHub Release body and as something we splice into
          # CHANGELOG.md below.
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          body_path: ${{ github.workspace }}/RELEASE_NOTES.md

      # Fresh checkout of main so we commit to the branch tip, not the
      # tag ref. Full depth so the push-retry rebase below has a merge
      # base if main moved.
      - name: Checkout main for CHANGELOG commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: main-checkout

      - name: Splice release notes into CHANGELOG.md
        # git-cliff's --prepend writes above the "# Changelog" preamble
        # and breaks the file's top shape, so we awk the section in
        # right before the first existing `## [` heading instead. Guard
        # makes it idempotent: if this version is already present (e.g.
        # the release job is being re-run), do nothing.
        working-directory: main-checkout
        run: |
          notes="${{ github.workspace }}/RELEASE_NOTES.md"
          if [ ! -s "$notes" ]; then
            echo "release notes empty; nothing to splice"
            exit 0
          fi
          version="${TAG#v}"
          if grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "CHANGELOG.md already has ${version}; skipping splice"
            exit 0
          fi
          awk -v notes="$notes" '
            BEGIN { done=0 }
            !done && /^## \[/ {
              while ((getline line < notes) > 0) print line
              print ""
              done=1
            }
            { print }
          ' CHANGELOG.md > CHANGELOG.md.new
          mv CHANGELOG.md.new CHANGELOG.md

      - name: Commit CHANGELOG update back to main
        working-directory: main-checkout
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "CHANGELOG.md unchanged; skipping commit"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          # chore(…) so the commit itself is skipped by git-cliff and
          # doesn't recursively show up in the next release's notes.
          git commit -m "chore(changelog): ${TAG} [skip ci]"
          # Robust push: main may have moved (a human push, the dev→main
          # merge, etc.) between checkout and now. Without a rebase+retry
          # the non-fast-forward push silently loses this version's
          # changelog — which is how earlier releases went missing.
          # Explicit refspec (HEAD:refs/heads/main) so a stray
          # refs/tags/main can't make the short form ambiguous.
          n=0
          until git push origin HEAD:refs/heads/main; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "CHANGELOG push failed after $n attempts" >&2
              exit 1
            fi
            echo "push rejected; rebasing onto latest main (attempt $n)…"
            git fetch origin main
            git rebase origin/main
          done
